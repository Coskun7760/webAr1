<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      /* Buton stilleri */
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50; /* Yeşil */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000; /* AR sahnesinin üzerinde görünmesi için */
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      .capture-button:nth-of-type(2) { /* İkinci buton için özel stil (Yeniden Hedef Ara) */
        bottom: 80px; 
        background-color: #f44336; /* Kırmızı */
      }
      .capture-button:nth-of-type(2):hover {
        background-color: #d32f2f;
      }

      /* Video elementinin tam ekran olması için */
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>

    <script>
      // Howler.js ile arka plan müziği
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false // Müziğin otomatik başlamasını istemiyoruz, targetFound ile başlayacak
      });

      // --- A-FRAME BİLEŞENİ: mytarget ---
      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el; // MindAR hedef varlığı (a-entity mindar-image-target)
          const sceneEl = document.querySelector('a-scene');
          const animatedModel = document.querySelector('#animatedModel');
          const cameraEl = document.querySelector('a-camera');

          this.targetFoundOnce = false; // Hedefin en az bir kez algılanıp algılanmadığını takip eder
          this.isModelAttachedToTarget = true; // Modelin şu anda hedefin içinde mi yoksa sahneye sabitlenmiş mi olduğunu gösterir

          // Modelin hedef kaybolduğunda alacağı sabit dünya pozisyonu
          // Bu değerleri kendi denemelerinle en iyi görünümü verecek şekilde ayarla
          // Örn: (0, -75, -450) gibi Z'si daha büyük negatif bir değer, modeli daha uzak gösterir
          this.fixedWorldPosition = new THREE.Vector3(0, -75, -450); 
          
          // Modelin başlangıç ölçeği (zoom için referans)
          this.initialModelScale = new THREE.Vector3(100, 100, 100);
          // Maksimum ve minimum ölçek çarpanları (bu çarpanlar initialModelScale'i etkiler)
          this.minScaleFactor = 0.5; // Örn: 100 * 0.5 = 50 birim (modelin küçülebileceği en alt limit)
          this.maxScaleFactor = 3.0; // Örn: 100 * 3.0 = 300 birim (modelin büyüyebileceği en üst limit)
          
          // Anlık ölçek çarpanını tutan değişken
          this.currentScaleFactor = 1.0; // Başlangıçta 1x ölçek

          // MindAR'ın UI overlay elementini bulalım
          let mindarUiOverlay = null;

          // A-Frame sahnesi yüklendiğinde, MindAR UI elementini bulmaya çalış
          sceneEl.addEventListener('loaded', () => {
              mindarUiOverlay = document.querySelector('.mindar-ui-overlay.mindar-ui-scanning');
              if (mindarUiOverlay) {
                  console.log("MindAR UI Overlay bulundu.");
                  // Sayfa yüklendiğinde tarama UI'ını başlangıçta gizli tut.
                  mindarUiOverlay.style.setProperty('display', 'none', 'important');
              } else {
                  console.warn("MindAR UI Overlay elementi bulunamadı. Hedef arama UI'ını kontrol etmek mümkün olmayabilir.");
              }
          });		
          
          // 3D Model yüklendiğinde (sadece kontrol ve debug için)
          animatedModel.addEventListener('model-loaded', () => {
              console.log("3D Model tamamen yüklendi!");
          });

          // --- HEDEF BULUNDUĞUNDA (TARGET FOUND) ---
          el.addEventListener("targetFound", (event) => {
            console.log("AR Hedefi algılandı!");

            // 1. Hedef ilk bulunduğunda: 3D model görünsün ve müzik başlasın.
            if (!this.targetFoundOnce) {
                if (backgroundMusic && !backgroundMusic.playing()) {
                    backgroundMusic.play();
                    console.log("Howler.js sesi oynatılıyor.");
                } else if (backgroundMusic && backgroundMusic.playing()) {
                    console.log("Howler.js sesi zaten çalıyor.");
                } else {
                    console.warn("Howler.js sesi başlatılamadı.");
                }
                this.targetFoundOnce = true;
            }

            // 4. Hedefi tekrar gösterince: MindAR hedefi tekrar tanısın ve model tekrar hedefe sabitlensin.
            if (!this.isModelAttachedToTarget) { // Eğer model şu an hedefe bağlı değilse (yani sahneye sabitlenmişse), hedefe geri bağla
              console.log("Model hedefe geri ekleniyor.");
              
              // Eğer model sahnenin çocuğu ise sahneden kaldır
              if (animatedModel.parent === sceneEl.object3D) { 
                  sceneEl.object3D.remove(animatedModel.object3D);
              }

              // Modelin pozisyonunu hedefe göre varsayılan haline getir (hedef referanslı pozisyon)
              animatedModel.setAttribute('position', '0 -0.5 0.1');
              animatedModel.setAttribute('rotation', '0 0 0'); // Varsayılan rotasyon
              animatedModel.setAttribute('scale', '0.5 0.5 0.5'); // Varsayılan ölçek

              el.object3D.add(animatedModel.object3D); // Hedefe geri ekle
              this.isModelAttachedToTarget = true; 
              
              // Önemli: look-controls'un zoom özelliğini devre dışı bırak. 
              // Hedef üzerindeyken doğal perspektif işlesin, manuel zoom olmasın.
              cameraEl.setAttribute('look-controls', 'zoom: false'); 

              console.log("Model hedef üzerinde görünür.");
            }
            
            animatedModel.setAttribute('visible', true); // Modeli görünür yap

            // Modelin setAttribute sonrası aldığı gerçek dünya değerlerini konsola yazdır (Debug amaçlı)
            const checkPos = new THREE.Vector3();
            animatedModel.object3D.getWorldPosition(checkPos);
            const checkRot = new THREE.Quaternion();
            animatedModel.object3D.getWorldQuaternion(checkRot);
            const checkScale = new THREE.Vector3();
            animatedModel.object3D.getWorldScale(checkScale);

            console.log("--- HEDEF ÜZERİNDE: Modelin GERÇEK Dünya Değerleri (Kontrol) ---");
            console.log("Pozisyon:", checkPos.x.toFixed(2), checkPos.y.toFixed(2), checkPos.z.toFixed(2));
            const checkEulerRot = new THREE.Euler().setFromQuaternion(checkRot, 'YXZ');
            console.log("Dönme (Euler):", THREE.MathUtils.radToDeg(checkEulerRot.x).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.y).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.z).toFixed(0));
            console.log("Boyut:", checkScale.x.toFixed(2), checkScale.y.toFixed(2), checkScale.z.toFixed(2));
            console.log("------------------------------------------------------------------");
          });

          // --- HEDEF KAYBOLDUĞUNDA (TARGET LOST) ---
          el.addEventListener("targetLost", (event) => {
            console.log("AR Hedefi kaybedildi!");

            // 2. Hedef kaybolduğunda (kameradan çıkınca): 3D model olduğu yerde sabit kalsın (kaybolmasın).
            // Hedef daha önce algılandıysa VE model hala hedefe bağlıysa, sahneye taşı
            if (this.targetFoundOnce && this.isModelAttachedToTarget) {
              console.log("Model sahneye sabitleniyor ve dokunmatik zoom etkinleştiriliyor.");

              // Modeli hedeften kaldır
              el.object3D.remove(animatedModel.object3D);
              // Modeli doğrudan sahneye ekle
              sceneEl.object3D.add(animatedModel.object3D); 

              this.isModelAttachedToTarget = false;
              
              // Modelin dünya pozisyonunu sabitle
              animatedModel.object3D.position.copy(this.fixedWorldPosition);
              animatedModel.object3D.quaternion.identity(); // Rotasyonunu da sabitle (dönmesin)

              // Modelin başlangıç ölçeğini ayarla (zoom buradan başlayacak)
              this.currentScaleFactor = 1.0; // Zoom çarpanını sıfırla, başlangıç 1x ölçek
              animatedModel.object3D.scale.copy(this.initialModelScale);

              // Önemli: look-controls'un zoom özelliğini etkinleştir.
              cameraEl.setAttribute('look-controls', 'zoom: true'); 
              
              // Modelin setAttribute sonrası aldığı gerçek dünya değerlerini konsola yazdır (Debug amaçlı)
              const checkPos = new THREE.Vector3();
              animatedModel.object3D.getWorldPosition(checkPos);
              const checkRot = new THREE.Quaternion();
              animatedModel.object3D.getWorldQuaternion(checkRot);
              const checkScale = new THREE.Vector3();
              animatedModel.object3D.getWorldScale(checkScale);

              console.log("--- HEDEF KAYBOLDU: Modelin GERÇEK Dünya Değerleri (Kontrol) ---");
              console.log("Pozisyon:", checkPos.x.toFixed(2), checkPos.y.toFixed(2), checkPos.z.toFixed(2));
              const checkEulerRot = new THREE.Euler().setFromQuaternion(checkRot, 'YXZ');
              console.log("Dönme (Euler):", THREE.MathUtils.radToDeg(checkEulerRot.x).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.y).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.z).toFixed(0));
              console.log("Boyut:", checkScale.x.toFixed(2), checkScale.y.toFixed(2), checkScale.z.toFixed(2));
              console.log("------------------------------------------------------------------");
            }
            
            animatedModel.setAttribute('visible', true); // Modeli görünür yap (MindAR gizlemiş olabilir)

            // KRİTİK DÜZELTME: Hedef kaybolduğunda MindAR 'hidden' sınıfını siliyor.
            // Bu yüzden biz devreye girip MindAR'ın UI'ını tekrar gizliyoruz.
            if (mindarUiOverlay) {
                mindarUiOverlay.style.setProperty('display', 'none', 'important');
                console.log("MindAR arama UI'ı hedef kaybedildiğinde JavaScript tarafından tekrar gizlendi.");
            }
            // Müzik çalmaya devam edecek, bu kısımda durdurmuyoruz.
          });

          // --- YENİ EKLENEN OLAY DİNLEYİCİ: 'zoom' OLAYI ---
          // A-Frame'in look-controls bileşeni, zoom hareketlerinde 'zoom' adında bir olay tetikler.
          cameraEl.addEventListener('zoom', (event) => {
              // Bu olay sadece look-controls'un zoom özelliği etkin olduğunda tetiklenir.
              if (!this.isModelAttachedToTarget) { // Sadece model sahneye sabitlenmişse ölçeklendir
                  const zoomAmount = event.detail.zoomFactor; // Zoom miktarı (örn: 1.1, 0.9)

                  // Mevcut ölçek çarpanını güncelle
                  this.currentScaleFactor *= zoomAmount;

                  // Ölçek çarpanını belirli limitler içinde tut
                  this.currentScaleFactor = Math.max(this.minScaleFactor, Math.min(this.maxScaleFactor, this.currentScaleFactor));

                  // Modelin yeni ölçeğini hesapla ve uygula
                  const newScaleX = this.initialModelScale.x * this.currentScaleFactor;
                  const newScaleY = this.initialModelScale.y * this.currentScaleFactor;
                  const newScaleZ = this.initialModelScale.z * this.currentScaleFactor;
                  
                  animatedModel.object3D.scale.set(newScaleX, newScaleY, newScaleZ);
                  
                  console.log(`Zoom Faktör: ${zoomAmount.toFixed(2)}, Güncel Ölçek Çarpanı: ${this.currentScaleFactor.toFixed(2)}, Yeni Model Ölçeği: ${newScaleX.toFixed(2)}`);
              }
          });
        }, // init fonksiyonunun sonu
      }); // AFRAME.registerComponent("mytarget")'in sonu

      // --- Yardımcı Fonksiyonlar (Aynı Kalıyor) ---

      // Fotoğraf çekme fonksiyonu
      async function takeScreenshot() {
        console.log("AR fotoğrafı çekiliyor...");

        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl) {
          console.error("A-Frame sahnesi bulunamadı.");
          alert("Fotoğraf çekilemedi: A-Frame sahnesi bulunamadı.");
          return;
        }

        const videoElement = document.querySelector('video');
        if (!videoElement || videoElement.readyState < 2) {
          console.error("Kamera video elementi bulunamadı veya hazır değil.");
          alert("Fotoğraf çekilemedi: Kamera videosu hazır değil veya bulunamadı. Lütfen kamera izni verdiğinizden ve video akışının başladığından emin olun.");
          return;
        }

        const arWebGLCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;
        if (!arWebGLCanvas) {
          console.error("A-Frame render canvas'ı bulunamadı.");
          alert("Fotoğraf çekilemedi: AR içeriği canvas'ı bulunamadı.");
          return;
        }

        try {
          videoElement.pause();

          const combinedCanvas = document.createElement("canvas");
          let captureWidth = videoElement.videoWidth;
          let captureHeight = videoElement.videoHeight;

          if (captureWidth === 0 || captureHeight === 0) {
              console.warn("Video gerçek piksel boyutları alınamadı. Ekran viewport boyutları kullanılıyor.");
              captureWidth = window.innerWidth;
              captureHeight = window.innerHeight;
          }

          const resolutionMultiplier = 2; // Daha yüksek kaliteli ekran görüntüsü için çözünürlük çarpanı	

          combinedCanvas.width = captureWidth * resolutionMultiplier;
          combinedCanvas.height = captureHeight * resolutionMultiplier;

          const ctx = combinedCanvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          let arCanvasForScreenshot = sceneEl.components.screenshot.getCanvas('perspective');

          if (!arCanvasForScreenshot) {
              console.error("A-Frame screenshot canvas'ı 'perspective' bulunamadı.");
              alert("Fotoğraf çekilemedi: 3D model katmanı bulunamadı.");
              return;
          }

          ctx.drawImage(arCanvasForScreenshot, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          const screenshotDataURL = combinedCanvas.toDataURL('image/png');

          if (screenshotDataURL === 'data:,') {
            console.warn("Çekilen fotoğraf boş veya geçersiz. Tekrar denenecek.");
            alert("Fotoğraf çekilemedi: Görüntü yakalanamadı. Lütfen kamera akışının aktif olduğundan ve modelin göründüğünden emin olun.");
            return;
          }

          const link = document.createElement('a');
          link.href = screenshotDataURL;
          link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          console.log("AR fotoğrafı başarıyla alındı ve indirildi.");

        } catch (error) {
          console.error("Fotoğraf çekme sırasında kritik hata oluştu:", error);
          alert("Fotoğraf çekilemedi. Tarayıcıda bir hata oluştu veya izinler yetersiz. Lütfen konsolu kontrol edin. (Hata detayı: " + error.message + ")");
        } finally {
            if (videoElement.paused) {
                videoElement.play();
            }
        }
      }

      // AR sahnesini sıfırlama ve hedef arama moduna dönme
      function resetARScene() {
          console.log("AR sahnesi sıfırlanıyor ve hedef arama moduna dönülüyor...");
          location.reload(); // Sayfayı yeniden yüklemek en temiz sıfırlama yoludur
          
          if (backgroundMusic && backgroundMusic.playing()) {
              backgroundMusic.stop();
              console.log("Howler.js sesi durduruldu.");
          }
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      webgl-renderer="preserveDrawingBuffer: true;"  
      screenshot="" > 
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera 
        position="0 0 0" 
        look-controls="enabled: true; touchEnabled: true; zoom: false" 
        wasd-controls="enabled: false"
        far="10000"  fov="80"> </a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1"
          visible="false"> </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek İnşaallah</button>
    <button class="capture-button" onclick="resetARScene()">Yeniden Hedef Ara</button>

  </body>
</html>
