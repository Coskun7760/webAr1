<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      /* Buton stilleri aynı kalıyor */
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50; /* Yeşil */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000; /* AR sahnesinin üzerinde görünmesi için */
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Yükleniyor ekranını gizle (bu genellikle MindAR'ın ilk yüklemesinde görünür) */
     
      
      /* MindAR'ın kendi tarama UI'ını başlangıçta gizlemek için bu CSS kuralını kullanıyoruz.
         JavaScript ile 'hidden' sınıfını kaldırarak görünür yapacağız. */
     
    </style>

    <script>
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false // Müziğin otomatik başlamasını istemiyoruz, targetFound ile başlayacak
      });

   AFRAME.registerComponent("mytarget", {
  init: function () {
    const el = this.el; // MindAR hedef varlığı (a-entity mindar-image-target)
    const sceneEl = document.querySelector('a-scene');
    const animatedModel = document.querySelector('#animatedModel');
    const cameraEl = document.querySelector('a-camera');

    this.targetFoundOnce = false;
    this.isModelAttachedToTarget = true;
    
    // YENİ FLAG: Modelin şu an kameraya bağlı olup olmadığını net bir şekilde belirtir
    this.modelAttachedToCamera = false; 

    // Kameranın başlangıç Z pozisyonunu kaydet (opsiyonel, hesaplama için)
    // let initialCameraZ = 0; // Bu, kameranın başlangıç Z'si (genellikle 0)
    // Modelin başlangıç ölçeği (hedef kaybolduğunda manuel ayarladığımız ölçek)
    const initialModelScale = new THREE.Vector3(100, 100, 100); 

    let mindarUiOverlay = null;

    sceneEl.addEventListener('loaded', () => {
        mindarUiOverlay = document.querySelector('.mindar-ui-overlay.mindar-ui-scanning');
        if (mindarUiOverlay) {
            console.log("MindAR UI Overlay bulundu.");
            mindarUiOverlay.style.setProperty('display', 'none', 'important');
        } else {
            console.warn("MindAR UI Overlay elementi bulunamadı. Hedef arama UI'ını kontrol etmek mümkün olmayabilir.");
        }
    });		
    
    animatedModel.addEventListener('model-loaded', () => {
        console.log("3D Model tamamen yüklendi!");
    });

    // --- HEDEF BULUNDUĞUNDA (TARGET FOUND) ---
    el.addEventListener("targetFound", (event) => {
      console.log("AR Hedefi algılandı!");

      if (!this.targetFoundOnce) {
        if (typeof backgroundMusic !== 'undefined' && backgroundMusic && !backgroundMusic.playing()) {
          backgroundMusic.play();
          console.log("Howler.js sesi oynatılıyor.");
        } else if (backgroundMusic && backgroundMusic.playing()) {
          console.log("Howler.js sesi zaten çalıyor.");
        } else {
          console.warn("Howler.js sesi başlatılamadı.");
        }
        this.targetFoundOnce = true;
      }

      if (!this.isModelAttachedToTarget) { // Eğer model şu an hedefe bağlı değilse
        console.log("Model hedefe geri ekleniyor.");
        
        // Modelin şu anki parent'ını (üst öğesini) kontrol et ve kaldır
        if (animatedModel.parent === cameraEl.object3D) { 
            cameraEl.object3D.remove(animatedModel.object3D);
        } else if (animatedModel.parent === sceneEl.object3D) { 
            sceneEl.object3D.remove(animatedModel.object3D);
        }

        // Modelin pozisyonunu hedefe göre varsayılan haline getir (hedef referanslı pozisyon)
        animatedModel.setAttribute('position', '0 -0.5 0.1');
        animatedModel.setAttribute('rotation', '0 0 0');
        animatedModel.setAttribute('scale', '0.5 0.5 0.5'); 

        el.object3D.add(animatedModel.object3D); // Hedefe geri ekle
        this.isModelAttachedToTarget = true; 
        this.modelAttachedToCamera = false; // Model artık kameraya bağlı değil
        console.log("Model hedef üzerinde görünür.");
      }
      
      animatedModel.setAttribute('visible', true); // Modeli görünür yap

      // ... (Konsol çıktıları aynı kalabilir)
      const checkPos = new THREE.Vector3();
      animatedModel.object3D.getWorldPosition(checkPos);
      const checkRot = new THREE.Quaternion();
      animatedModel.object3D.getWorldQuaternion(checkRot);
      const checkScale = new THREE.Vector3();
      animatedModel.object3D.getWorldScale(checkScale);

      console.log("--- HEDEF ÜZERİNDE: Modelin GERÇEK Dünya Değerleri ---");
      console.log("Pozisyon:", checkPos.x.toFixed(2), checkPos.y.toFixed(2), checkPos.z.toFixed(2));
      const checkEulerRot = new THREE.Euler().setFromQuaternion(checkRot, 'YXZ');
      console.log("Dönme (Euler):", THREE.MathUtils.radToDeg(checkEulerRot.x).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.y).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.z).toFixed(0));
      console.log("Boyut:", checkScale.x.toFixed(2), checkScale.y.toFixed(2), checkScale.z.toFixed(2));
      console.log("-----------------------------------------------------");
    });

    // --- HEDEF KAYBOLDUĞUNDA (TARGET LOST) ---
    el.addEventListener("targetLost", (event) => {
      console.log("AR Hedefi kaybedildi!");

      if (this.targetFoundOnce && this.isModelAttachedToTarget) {
        console.log("Model kameraya sabitleniyor.");

        el.object3D.remove(animatedModel.object3D);
        cameraEl.object3D.add(animatedModel.object3D); // Modeli kameranın çocuğu yap

        this.isModelAttachedToTarget = false;
        this.modelAttachedToCamera = true; // Model artık kameraya bağlı

        const localPos = new THREE.Vector3(0, -75, -450); 
        const localRot = new THREE.Quaternion().identity();
        const localScale = new THREE.Vector3(100, 100, 100); 

        animatedModel.object3D.position.copy(localPos);
        animatedModel.object3D.quaternion.copy(localRot);
        animatedModel.object3D.scale.copy(localScale);
        
        // initialCameraZ = cameraEl.object3D.position.z; // Model kameraya bağlandığında kameranın Z'sini kaydet
        
        // ... (Konsol çıktıları aynı kalabilir)
        const finalLocalPos = new THREE.Vector3();
        animatedModel.object3D.getPosition(finalLocalPos); 
        const finalLocalRot = new THREE.Quaternion();
        animatedModel.object3D.getQuaternion(finalLocalRot); 
        const finalLocalScale = new THREE.Vector3();
        animatedModel.object3D.getScale(finalLocalScale); 

        console.log("--- HEDEF KAYBOLDU: Modelin Kameraya Göre YEREL Değerleri ---");
        console.log("Yerel Pozisyon (x, y, z):", finalLocalPos.x.toFixed(2), finalLocalPos.y.toFixed(2), finalLocalPos.z.toFixed(2));
        const finalEulerRot = new THREE.Euler().setFromQuaternion(finalLocalRot, 'YXZ');
        console.log("Yerel Dönme (Euler):", THREE.MathUtils.radToDeg(finalEulerRot.x).toFixed(0), THREE.MathUtils.radToDeg(finalEulerRot.y).toFixed(0), THREE.MathUtils.radToDeg(finalEulerRot.z).toFixed(0));
        console.log("Yerel Boyut (x, y, z):", finalLocalScale.x.toFixed(2), finalLocalScale.y.toFixed(2), finalLocalScale.z.toFixed(2));
        console.log("-------------------------------------------------------");
      }

      animatedModel.setAttribute('visible', true); 

      if (mindarUiOverlay) {
        mindarUiOverlay.style.setProperty('display', 'none', 'important');
      }
    });

    // --- YENİ EKLENEN KISIM: tick FONKSİYONU ---
    // Her karede çalışan fonksiyon
    this.tick = function() {
      if (this.modelAttachedToCamera) { // Model kameraya bağlıysa
        const currentCameraZ = cameraEl.object3D.position.z; // Kameranın dünya Z pozisyonunu al

        // Kameranın Z pozisyonuna göre modelin ölçeğini ayarla
        // Bu formül ile dene-yanılma yapman gerekecek!
        // Amacımız, kameranın Z'si değiştikçe modelin ölçeğini buna göre ayarlamak.
        
        // Örnek bir formül:
        // Kameranın 0'dan ne kadar uzaklaştığını/yaklaştığını baz alalım.
        // Daha düşük Z değeri (kameraya yakınlaşma) -> Model büyüsün
        // Daha yüksek Z değeri (kameradan uzaklaşma) -> Model küçülsün
        
        // Kameranın Z pozisyonu negatif olabilir (ekrana doğru).
        // Bu yüzden mutlak değeri veya 0'dan farkı önemlidir.
        // Başlangıç mesafesi (modelin kameraya yerel Z'si) -450 idi.
        // Kameranın dünya Z'si de genelde 0'a yakın olur.
        
        // Varsayalım ki ideal ölçeği (100) -450 Z mesafesinde istiyoruz.
        // Kamera -300'e gelince büyüsün, -600'e gelince küçülsün.
        
        // Bir "sabit" referans noktası ve "hassasiyet" belirleyelim
        const referenceZ = -450; // Modelin ideal boyutta olduğu Z mesafesi
        const sensitivity = 0.5; // Z değişiminin ölçek üzerindeki etkisi (daha büyük hassasiyet = daha hızlı boyut değişimi)

        // Kameranın referans Z'ye göre ne kadar değiştiğini bul
        const zDifference = currentCameraZ - referenceZ; // Pozitif: uzaklaşma, Negatif: yakınlaşma

        // Yeni ölçek faktörünü hesapla
        // Inverse Square Law benzeri bir şey: mesafe arttıkça etki azalır, azaldıkça artar.
        // Veya daha basit, lineer bir ilişki:
        let scaleFactor = 1 + (-zDifference * sensitivity / 1000); // 1000'e bölerek etkiyi azaltıyoruz

        // Ölçek faktörünü sınırlayabiliriz, aşırı büyük veya küçük olmasın
        scaleFactor = Math.max(0.1, Math.min(2.0, scaleFactor)); // Örn: 0.1x ile 2.0x arasında

        // Modelin başlangıç ölçeğini (100) yeni faktörle çarp
        const newScaleX = initialModelScale.x * scaleFactor;
        const newScaleY = initialModelScale.y * scaleFactor;
        const newScaleZ = initialModelScale.z * scaleFactor;

        animatedModel.object3D.scale.set(newScaleX, newScaleY, newScaleZ);
        
        // Debug için konsola yazdır
        // console.log(`Kamera Z: ${currentCameraZ.toFixed(2)}, Fark: ${zDifference.toFixed(2)}, Ölçek Faktör: ${scaleFactor.toFixed(2)}`);
        // console.log(`Yeni Model Ölçeği: ${newScaleX.toFixed(2)}`);
      }
    };
  },
  // Eğer component'i durdurursak tick fonksiyonunu da durdurmalıyız (cleanup)
  // remove: function() {
  //   this.el.sceneEl.removeEventListener('tick', this.tick);
  // }
});

      // Fotoğraf çekme fonksiyonu - AYNI KALDI
      async function takeScreenshot() {
        console.log("AR fotoğrafı çekiliyor...");

        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl) {
          console.error("A-Frame sahnesi bulunamadı.");
          alert("Fotoğraf çekilemedi: A-Frame sahnesi bulunamadı.");
          return;
        }

        const videoElement = document.querySelector('video');
        if (!videoElement || videoElement.readyState < 2) {
          console.error("Kamera video elementi bulunamadı veya hazır değil.");
          alert("Fotoğraf çekilemedi: Kamera videosu hazır değil veya bulunamadı. Lütfen kamera izni verdiğinizden ve video akışının başladığından emin olun.");
          return;
        }

        const arWebGLCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;
        if (!arWebGLCanvas) {
          console.error("A-Frame render canvas'ı bulunamadı.");
          alert("Fotoğraf çekilemedi: AR içeriği canvas'ı bulunamadı.");
          return;
        }

        try {
          videoElement.pause();

          const combinedCanvas = document.createElement("canvas");
          let captureWidth = videoElement.videoWidth;
          let captureHeight = videoElement.videoHeight;

          if (captureWidth === 0 || captureHeight === 0) {
              console.warn("Video gerçek piksel boyutları alınamadı. Ekran viewport boyutları kullanılıyor.");
              captureWidth = window.innerWidth;
              captureHeight = window.innerHeight;
          }

          const resolutionMultiplier = 2;	

          combinedCanvas.width = captureWidth * resolutionMultiplier;
          combinedCanvas.height = captureHeight * resolutionMultiplier;

          const ctx = combinedCanvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          let arCanvasForScreenshot = sceneEl.components.screenshot.getCanvas('perspective');

          if (!arCanvasForScreenshot) {
              console.error("A-Frame screenshot canvas'ı 'perspective' bulunamadı.");
              alert("Fotoğraf çekilemedi: 3D model katmanı bulunamadı.");
              return;
          }

          ctx.drawImage(arCanvasForScreenshot, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          const screenshotDataURL = combinedCanvas.toDataURL('image/png');

          if (screenshotDataURL === 'data:,') {
            console.warn("Çekilen fotoğraf boş veya geçersiz. Tekrar denenecek.");
            alert("Fotoğraf çekilemedi: Görüntü yakalanamadı. Lütfen kamera akışının aktif olduğundan ve modelin göründüğünden emin olun.");
            return;
          }

          const link = document.createElement('a');
          link.href = screenshotDataURL;
          link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          console.log("AR fotoğrafı başarıyla alındı ve indirildi.");

        } catch (error) {
          console.error("Fotoğraf çekme sırasında kritik hata oluştu:", error);
          alert("Fotoğraf çekilemedi. Tarayıcıda bir hata oluştu veya izinler yetersiz. Lütfen konsolu kontrol edin. (Hata detayı: " + error.message + ")");
        } finally {
            if (videoElement.paused) {
                videoElement.play();
            }
        }
      }

      // AR sahnesini sıfırlama ve hedef arama moduna dönme
      function resetARScene() {
          console.log("AR sahnesi sıfırlanıyor ve hedef arama moduna dönülüyor...");
          location.reload(); // Sayfayı yeniden yüklemek en temiz sıfırlama yoludur
          
          if (backgroundMusic && backgroundMusic.playing()) {
              backgroundMusic.stop();
              console.log("Howler.js sesi durduruldu.");
          }
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      webgl-renderer="preserveDrawingBuffer: true;"  
      screenshot="" > 
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1"
          visible="false"> </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek  İnşaallah</button>
    <button class="capture-button" style="bottom: 80px; background-color: #f44336;" onclick="resetARScene()">Yeniden Hedef Ara</button>

  </body>
</html>
