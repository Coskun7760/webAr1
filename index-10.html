<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
      
  	<script src="./js/aframe.min.js"></script>
	<script src="./js/mindar-image-aframe.prod.js"></script>
	<script src="./js/aframe-extras.min.js"></script>
	<script src="./js/howler.min.js"></script>


    <style>
      /* Buton stilleri aynı kalıyor */
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50; /* Yeşil */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000; /* AR sahnesinin üzerinde görünmesi için */
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Yükleniyor ekranını gizle (bu genellikle MindAR'ın ilk yüklemesinde görünür) */
     
      
      /* MindAR'ın kendi tarama UI'ını başlangıçta gizlemek için bu CSS kuralını kullanıyoruz.
         JavaScript ile 'hidden' sınıfını kaldırarak görünür yapacağız. */
     
    </style>

    <script>
      var modelSound1 = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false // Müziğin otomatik başlamasını istemiyoruz, targetFound ile başlayacak
      });
 	var modelSound2 = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses1.mp3'],
        volume: 1.0,
        autoplay: false // Müziğin otomatik başlamasını istemiyoruz, targetFound ile başlayacak
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el; // MindAR hedef varlığı (a-entity mindar-image-target)
          const sceneEl = document.querySelector('a-scene');
          // const animatedModel = document.querySelector('#animatedModel');
			
		  const animatedModel = el.querySelector('a-gltf-model');
          // Bileşen seviyesinde bayraklar
          this.targetFoundOnce = false;  // Hedefin en az bir kez algılanıp algılanmadığını takip eder
          this.isModelAttachedToTarget = true; // Modelin şu anda hedefin içinde mi yoksa sahneye sabitlenmiş mi olduğunu gösterir

          // MindAR'ın UI overlay elementini bulalım
          let mindarUiOverlay = null;
		 
    	  let backgroundMusic = null;
		  this.currentTarget = -1;
          // A-Frame sahnesi yüklendiğinde, MindAR UI elementini bulmaya çalış
          sceneEl.addEventListener('loaded', () => {
              mindarUiOverlay = document.querySelector('.mindar-ui-overlay.mindar-ui-scanning');
              if (mindarUiOverlay) {
                  console.log("MindAR UI Overlay bulundu.");
				  console.log(mindarUiOverlay);
                  // Sayfa yüklendiğinde tarama UI'ını başlangıçta gizli tut.
                  // CSS kuralımız zaten bunu yapıyor, buraya ek kod gerekmez.
                  // MindAR'ın kendi 'hidden' sınıfını manuel eklemeyeceğiz
                  // çünkü CSS'imiz .mindar-ui-overlay.mindar-ui-scanning'i direkt gizliyor.
              } else {
                  console.warn("MindAR UI Overlay elementi bulunamadı. Hedef arama UI'ını kontrol etmek mümkün olmayabilir.");
              }		  
				
          });		
				
			
          // Hedef bulunduğunda
          	el.addEventListener("targetFound", (event) => {
            console.log("AR Hedefi algılandı!");
			  
			 // const targetIndex = el.getAttribute('mindar-image-target').targetIndex;
			// Doğru Yöntem: targetIndex'i MindAR bileşeninin verisinden alıyoruz 
			 const targetIndex = el.components['mindar-image-target'].data.targetIndex;
			   // Bu hedefe ait ses değişkenini bulma
				
		
            if (targetIndex === 0) {
                backgroundMusic = modelSound1;
            } else if (targetIndex === 1) {
                backgroundMusic = modelSound2;
            } else if (targetIndex === 2) {
                backgroundMusic = null;
            }
			  

				
		    if (backgroundMusic && (!backgroundMusic.playing() || (backgroundMusic.playing() && this.currentTarget!=targetIndex) )) {
				Howler.stop(); 
			 	backgroundMusic.play();
			}
			else if (!backgroundMusic)
			{
				Howler.stop(); 
			}
								
			if (this.currentTarget!=targetIndex)
			{
				this.currentTarget = targetIndex;
			}
	  
            // KRİTİK DÜZELTME: İlk olarak, sahnedeki TÜM 3D modelleri gizle
			// Bu, önceki hedefin modelinin ekranda kalmasını engeller.
			document.querySelectorAll('a-gltf-model').forEach(model => {
				model.setAttribute('visible', false);
			});

			// 4. Hedefi tekrar gösterince: MindAR hedefi tekrar tanısın ve model tekrar hedefe sabitlensin.
			// Modelin hedefe geri eklenmesi:
			if (!this.isModelAttachedToTarget) {
				console.log("Model hedefe geri ekleniyor.");
				sceneEl.object3D.remove(animatedModel.object3D); // Sahneden kaldır
				el.object3D.add(animatedModel.object3D); // Hedefe geri ekle

				// Modelin pozisyonunu hedefe göre varsayılan haline getir (hedef referanslı pozisyon)
				animatedModel.setAttribute('position', '0 -0.5 0.1');
				animatedModel.setAttribute('rotation', '0 0 0'); // Varsayılan rotasyon
				animatedModel.setAttribute('scale', '0.5 0.5 0.5'); // Varsayılan ölçek

				this.isModelAttachedToTarget = true; // Modelin tekrar hedefe bağlı olduğunu işaretle
			}

			// Modeli görünür yap
			animatedModel.setAttribute('visible', true);          	
          });

          // Hedef kaybedildiğinde
          el.addEventListener("targetLost", (event) => {
            console.log("AR Hedefi kaybedildi!");

            // 2. Hedef kaybolduğunda (kameradan çıkınca): 3D model olduğu yerde sabit kalsın (kaybolmasın).
            // Hedef daha önce algılandıysa VE model hala hedefe bağlıysa, sahneye taşı
            if (this.isModelAttachedToTarget) {
                console.log("Model sahneye sabitleniyor.");
              
                // Modeli hedeften kaldır
                el.object3D.remove(animatedModel.object3D);
                
                // Modeli doğrudan sahneye ekle (sahne referanslı pozisyon)
                sceneEl.object3D.add(animatedModel.object3D);

            
				const setPositionVector = new THREE.Vector3(0, -75, -450);     // Kameradan 3 birim önde, ortada.
				const setQuaternion = new THREE.Quaternion().identity();   // Hiç dönüş yok (0 0 0 Euler açısı gibi).
				const setScaleVector = new THREE.Vector3(100, 100,  100);         // Orijinal boyutunda (veya '0.5 0.5 0.5' gibi dene).
				
				
				// Modelin pozisyon, rotasyon ve ölçeğini bu manuel değerlere ayarla
				animatedModel.object3D.position.copy(setPositionVector);
				animatedModel.object3D.quaternion.copy(setQuaternion);
				animatedModel.object3D.scale.copy(setScaleVector);

			 
				// !!! BURADAKİ ÇIKTI ÖNEMLİ !!!
				// Modelin setAttribute sonrası aldığı değerleri konsola yazdır
				const checkPos = new THREE.Vector3();
				animatedModel.object3D.getWorldPosition(checkPos);
				const checkRot = new THREE.Quaternion();
				animatedModel.object3D.getWorldQuaternion(checkRot);
				const checkScale = new THREE.Vector3();
				animatedModel.object3D.getWorldScale(checkScale);

				console.log("--- setAttribute Sonrası Modelin GERÇEK Dünya Değerleri (Kontrol) ---");
				console.log("Pozisyon:", checkPos.x.toFixed(2), checkPos.y.toFixed(2), checkPos.z.toFixed(2));
				const checkEulerRot = new THREE.Euler().setFromQuaternion(checkRot, 'YXZ');
				console.log("Dönme (Euler):", THREE.MathUtils.radToDeg(checkEulerRot.x).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.y).toFixed(0), THREE.MathUtils.radToDeg(checkEulerRot.z).toFixed(0));
				console.log("Boyut:", checkScale.x.toFixed(2), checkScale.y.toFixed(2), checkScale.z.toFixed(2));
				console.log("------------------------------------------------------------------");
				
                this.isModelAttachedToTarget = false; // Modelin artık hedefe bağlı olmadığını işaretle
            }                  
         			  
			  // KRİTİK DÜZELTME: Hedef kaybolduğunda MindAR 'hidden' sınıfını siliyor.
            // Bu yüzden biz devreye girip MindAR'ın UI'ını tekrar gizliyoruz.
            if (mindarUiOverlay) {
                mindarUiOverlay.style.setProperty('display', 'none', 'important');
                console.log("MindAR arama UI'ı hedef kaybedildiğinde JavaScript tarafından tekrar gizlendi.");
            }
            // Müzik çalmaya devam edecek, bu kısımda durdurmuyoruz.
          });
        },
      });
		
	
// Fotoğraf çekme fonksiyonu - VİDEO VE AR MODEL İÇİN DİKEY-YATAY DÜZELTMELERİ
async function takeScreenshot() {
    console.log("AR fotoğrafı çekiliyor (Video ve Model için optimize ediliyor)...");

    const sceneEl = document.querySelector('a-scene');
    if (!sceneEl) {
        console.error("A-Frame sahnesi bulunamadı.");
        alert("Fotoğraf çekilemedi: A-Frame sahnesi bulunamadı.");
        return;
    }

    const videoElement = document.querySelector('video');
    if (!videoElement || videoElement.readyState < 2) {
        console.error("Kamera video elementi bulunamadı veya hazır değil.");
        alert("Fotoğraf çekilemedi: Kamera videosu hazır değil veya bulunamadı. Lütfen kamera izni verdiğinizden ve video akışının başladığından emin olun.");
        return;
    }

    const arWebGLCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;
    if (!arWebGLCanvas) {
        console.error("A-Frame render canvas'ı bulunamadı.");
        alert("Fotoğraf çekilemedi: AR içeriği canvas'ı bulunamadı.");
        return;
    }

    try {
        videoElement.pause();

        const combinedCanvas = document.createElement("canvas");
        const ctx = combinedCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // Kameranın raporladığı ham video boyutları
        let videoNativeWidth = videoElement.videoWidth;
        let videoNativeHeight = videoElement.videoHeight;

        // A-Frame/MindAR WebGL canvas'ının boyutları
        let arCanvasWidth = arWebGLCanvas.width;
        let arCanvasHeight = arWebGLCanvas.height;

        console.log(`Video Ham Boyutları: ${videoNativeWidth}x${videoNativeHeight}`);
        console.log(`AR WebGL Canvas Boyutları: ${arCanvasWidth}x${arCanvasHeight}`);
        console.log(`Pencere Boyutları: ${window.innerWidth}x${window.innerHeight}`);

        // Eğer video/ar boyutları alınamıyorsa (0 ise), pencere boyutlarını varsay
        if (videoNativeWidth === 0 || videoNativeHeight === 0) {
            console.warn("Video gerçek piksel boyutları alınamadı. Pencere boyutları varsayılıyor.");
            videoNativeWidth = window.innerWidth;
            videoNativeHeight = window.innerHeight;
        }
        if (arCanvasWidth === 0 || arCanvasHeight === 0) {
            console.warn("AR Canvas boyutları alınamadı. Pencere boyutları varsayılıyor.");
            arCanvasWidth = window.innerWidth;
            arCanvasHeight = window.innerHeight;
        }


        let targetCanvasWidth = videoNativeWidth;
        let targetCanvasHeight = videoNativeHeight;
        let rotationAngle = 0; // Radyan cinsinden

        // --- Yönlendirme ve En Boy Oranı Düzeltmesi ---
        // Telefonun dikeyde olup olmadığını belirlemek için pencere boyutlarını kullanmak daha güvenilir olabilir.
        const isDevicePortrait = window.innerHeight > window.innerWidth;

        // Eğer cihaz dikeyde ve video akışı yatay geliyorsa (ki bu en yaygın senaryodur)
        if (isDevicePortrait && videoNativeWidth > videoNativeHeight) {
            console.log("Cihaz dikeyde, video akışı yatay geliyor. Döndürme uygulanıyor.");
            rotationAngle = Math.PI / 2; // 90 derece döndür
            targetCanvasWidth = videoNativeHeight; // Canvas genişliği videonun yüksekliği olacak
            targetCanvasHeight = videoNativeWidth; // Canvas yüksekliği videonun genişliği olacak
        } else {
            console.log("Cihaz yatayda veya video akışı zaten dikey.");
        }

        const resolutionMultiplier = 2; // Yüksek çözünürlük için çarpan

        combinedCanvas.width = targetCanvasWidth * resolutionMultiplier;
        combinedCanvas.height = targetCanvasHeight * resolutionMultiplier;

        console.log(`Hesaplanan Nihai Canvas Boyutları: ${combinedCanvas.width}x${combinedCanvas.height}`);

        // --- Video Katmanını Çiz ---
        ctx.save(); // Mevcut canvas durumunu kaydet
        if (rotationAngle !== 0) {
            ctx.translate(combinedCanvas.width / 2, combinedCanvas.height / 2); // Merkeze taşı
            ctx.rotate(rotationAngle); // Döndür
            ctx.drawImage(videoElement,
                          -combinedCanvas.height / 2, // Yeni X konumu
                          -combinedCanvas.width / 2,  // Yeni Y konumu
                          combinedCanvas.height,      // Yeni çizim genişliği (döndürülmüş video için)
                          combinedCanvas.width        // Yeni çizim yüksekliği (döndürülmüş video için)
                         );
        } else {
            ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
        }
        ctx.restore(); // Kaydedilmiş canvas durumuna geri dön

        // --- AR Model Katmanını Çiz ---
        // AR canvas'ının kendi en boy oranını hesaplayalım
        const arAspectRatio = arCanvasWidth / arCanvasHeight;
        const targetAspectRatio = combinedCanvas.width / combinedCanvas.height;

        let arDrawWidth = combinedCanvas.width;
        let arDrawHeight = combinedCanvas.height;
        let arDrawX = 0;
        let arDrawY = 0;

        // AR Canvas'ı, birleştirilmiş canvas'a sığdırmak için boyutları ayarlayalım
        // Orijinal AR canvas'ının oranı ile hedef canvas'ın oranını karşılaştır
        if (arAspectRatio > targetAspectRatio) {
            // AR canvas daha geniş, yüksekliği sabitleyip genişliği ayarla
            arDrawHeight = combinedCanvas.height;
            arDrawWidth = arDrawHeight * arAspectRatio;
            arDrawX = (combinedCanvas.width - arDrawWidth) / 2; // Ortala
        } else {
            // AR canvas daha uzun, genişliği sabitleyip yüksekliği ayarla
            arDrawWidth = combinedCanvas.width;
            arDrawHeight = arDrawWidth / arAspectRatio;
            arDrawY = (combinedCanvas.height - arDrawHeight) / 2; // Ortala
        }

        console.log(`AR Canvas Çizim Boyutları: ${arDrawWidth.toFixed(2)}x${arDrawHeight.toFixed(2)} @ (${arDrawX.toFixed(2)}, ${arDrawY.toFixed(2)})`);

        // AR içeriğini birleştirilmiş canvas'a çiz.
        // Burada tekrar bir döndürme yapmıyoruz çünkü MindAR'ın WebGL çıktısının
        // zaten doğru yönelimde olduğu varsayılır. Sadece boyutu ve konumu ayarla.
        ctx.drawImage(arWebGLCanvas, arDrawX, arDrawY, arDrawWidth, arDrawHeight);
        
        const screenshotDataURL = combinedCanvas.toDataURL('image/png');

        if (!screenshotDataURL || screenshotDataURL === 'data:,') {
            console.warn("Çekilen fotoğraf boş veya geçersiz. Görüntü yakalanamadı. Kamera veya modelin görünür olduğundan emin olun.");
            alert("Fotoğraf çekilemedi: Görüntü yakalanamadı.");
            return;
        }

        const link = document.createElement('a');
        link.href = screenshotDataURL;
        link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        console.log("AR fotoğrafı başarıyla alındı ve indirildi.");

    } catch (error) {
        console.error("Fotoğraf çekme sırasında kritik hata oluştu:", error);
        alert("Fotoğraf çekilemedi. Tarayıcıda bir hata oluştu veya izinler yetersiz. Lütfen konsolu kontrol edin. (Hata detayı: " + error.message + ")");
    } finally {
        if (videoElement.paused) {
            videoElement.play();
        }
    }
}
      // AR sahnesini sıfırlama ve hedef arama moduna dönme
      function resetARScene() {
			console.log("AR sahnesi sıfırlanıyor ve hedef arama moduna dönülüyor...");
			location.reload(); // Sayfayı yeniden yüklemek en temiz sıfırlama yoludur

			// KRİTİK DÜZELTME: Artık tüm sesleri durdurmak için Howler.stop() kullanıyoruz.
			// Bu, hangi sesin çalıyor olursa olsun, hepsini durduracaktır.
			Howler.stop();
			console.log("Tüm Howler.js sesleri durduruldu.");
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targetsMulti.mind; filterMinCF:0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
	  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
      device-orientation-permission-ui="enabled: false"
      webgl-renderer="preserveDrawingBuffer: true;"  
      screenshot="" > 
      <a-assets>
        <a-asset-item id="model1" src="https://coskun7760.github.io/webAr1/muze-12.gltf"> </a-asset-item>
		<a-asset-item id="model2" src="https://coskun7760.github.io/webAr1/muze-123.gltf"> </a-asset-item> 
		<a-asset-item id="model3" src="https://coskun7760.github.io/webAr1/muze-1234.gltf"> </a-asset-item> 
		  
        <audio id="modelSound1" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>		  
		  
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
		  rotation="0 0 0"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#model1"
          animation-mixer="timeScale: 1"
          visible="false"> </a-gltf-model>
      </a-entity>
		
	 <a-entity id="mytarget1" mytarget mindar-image-target="targetIndex: 1">
        <a-gltf-model
          id="animatedModel1"
		  rotation="0 0 0"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#model2"
          animation-mixer="timeScale: 1"
          visible="false"> </a-gltf-model>
      </a-entity>
		
		 <a-entity id="mytarget2" mytarget mindar-image-target="targetIndex: 2">
        <a-gltf-model
          id="animatedModel2"
		  rotation="0 0 0"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#model3"
          animation-mixer="timeScale: 1"
          visible="false"> </a-gltf-model>
      </a-entity>
		
		
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek 1 İnşaallah</button>
    <button class="capture-button" style="bottom: 80px; background-color: #f44336;" onclick="resetARScene()">Yeniden Hedef Ara</button>

  </body>
</html>
