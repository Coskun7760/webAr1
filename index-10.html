<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      /* Buton stilleri aynı kalıyor */
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50; /* Yeşil */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000; /* AR sahnesinin üzerinde görünmesi için */
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Yükleniyor ekranını gizle (bu genellikle MindAR'ın ilk yüklemesinde görünür) */
     
      
      /* MindAR'ın kendi tarama UI'ını başlangıçta gizlemek için bu CSS kuralını kullanıyoruz.
         JavaScript ile 'hidden' sınıfını kaldırarak görünür yapacağız. */
     
    </style>

    <script>
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false // Müziğin otomatik başlamasını istemiyoruz, targetFound ile başlayacak
      });

   AFRAME.registerComponent("mytarget", {
  init: function () {
    const el = this.el; // MindAR hedef varlığı (a-entity mindar-image-target)
    const sceneEl = document.querySelector('a-scene');
    const animatedModel = document.querySelector('#animatedModel');
    const cameraEl = document.querySelector('a-camera'); // Kamerayı yakalamamız lazım!

    this.targetFoundOnce = false;
    this.isModelAttachedToTarget = true;
    this.modelAttachedToCamera = false; // Modelin şu an kameraya bağlı olup olmadığını net bir şekilde belirtir

    // Modelin hedef kaybolduğunda başlangıçta alacağı dünya pozisyonu ve ölçeği (ince ayar yap)
    const fixedWorldPosition = new THREE.Vector3(0, -75, -450); // Ekranın ortasına ve uygun mesafeye yerleştir
    const initialModelScaleValue = 100; // Başlangıç ölçek değeri (100, 100, 100 demek)

    let mindarUiOverlay = null;

    sceneEl.addEventListener('loaded', () => {
        mindarUiOverlay = document.querySelector('.mindar-ui-overlay.mindar-ui-scanning');
        if (mindarUiOverlay) {
            mindarUiOverlay.style.setProperty('display', 'none', 'important');
        }
    });		
    
    animatedModel.addEventListener('model-loaded', () => {
        console.log("3D Model tamamen yüklendi!");
    });

    // --- HEDEF BULUNDUĞUNDA (TARGET FOUND) ---
    el.addEventListener("targetFound", (event) => {
      console.log("AR Hedefi algılandı!");
      if (!this.targetFoundOnce) {
        if (typeof backgroundMusic !== 'undefined' && backgroundMusic && !backgroundMusic.playing()) { backgroundMusic.play(); }
        this.targetFoundOnce = true;
      }

      if (!this.isModelAttachedToTarget) { // Eğer model şu an hedefe bağlı değilse
        console.log("Model hedefe geri ekleniyor.");
        // Kameradan veya sahneden kaldır
        if (animatedModel.parent === cameraEl.object3D) { cameraEl.object3D.remove(animatedModel.object3D); } 
        else if (animatedModel.parent === sceneEl.object3D) { sceneEl.object3D.remove(animatedModel.object3D); }

        animatedModel.setAttribute('position', '0 -0.5 0.1');
        animatedModel.setAttribute('rotation', '0 0 0');
        animatedModel.setAttribute('scale', '0.5 0.5 0.5'); 

        el.object3D.add(animatedModel.object3D); // Hedefe geri ekle
        this.isModelAttachedToTarget = true; 
        this.modelAttachedToCamera = false; // Model artık kameraya bağlı değil
        console.log("Model hedef üzerinde görünür.");
      }
      animatedModel.setAttribute('visible', true);
      // ... (Kontrol amaçlı konsol çıktıları aynı kalabilir)
    });

    // --- HEDEF KAYBOLDUĞUNDA (TARGET LOST) ---
    el.addEventListener("targetLost", (event) => {
      console.log("AR Hedefi kaybedildi!");

      if (this.targetFoundOnce && this.isModelAttachedToTarget) {
        console.log("Model sahneye sabitleniyor ve manuel ölçeklendiriliyor.");

        el.object3D.remove(animatedModel.object3D);
        sceneEl.object3D.add(animatedModel.object3D); // Modeli doğrudan sahneye ekle

        this.isModelAttachedToTarget = false;
        this.modelAttachedToCamera = false; // Model kameranın çocuğu değil, sahnenin çocuğu

        // Modelin dünya pozisyonunu sabitle
        animatedModel.object3D.position.copy(fixedWorldPosition);
        animatedModel.object3D.quaternion.identity(); // Rotasyonunu da sabitle

        // Modelin başlangıç ölçeğini burada ayarla (tick içinde değişecek)
        animatedModel.object3D.scale.set(initialModelScaleValue, initialModelScaleValue, initialModelScaleValue);
        
        // ... (Konsol çıktıları aynı kalabilir, getWorldPosition kullanabilirsin)
        const checkPos = new THREE.Vector3();
        animatedModel.object3D.getWorldPosition(checkPos);
        console.log("--- HEDEF KAYBOLDU: Modelin Sabit Dünya Pozisyonu ---");
        console.log("Pozisyon:", checkPos.x.toFixed(2), checkPos.x.toFixed(2), checkPos.x.toFixed(2));
        console.log("-------------------------------------------------------");
      }

      animatedModel.setAttribute('visible', true); 

      if (mindarUiOverlay) {
        mindarUiOverlay.style.setProperty('display', 'none', 'important');
      }
    });

    // --- YENİLENEN tick FONKSİYONU ---
    this.tick = function() {
      // Modelin hedef kaybolduktan sonra sahneye sabitlendiğini varsayıyoruz
      if (!this.isModelAttachedToTarget) { 
        const worldCameraPosition = new THREE.Vector3();
        cameraEl.object3D.getWorldPosition(worldCameraPosition); // Kameranın dünya pozisyonunu al

        // Kameranın dünya Z pozisyonuna göre modelin ölçeğini ayarla
        // Bu formül ile DENE-YANILMA yapman gerekecek!
        // Amaç: Kamera modele yaklaştıkça büyüsün, uzaklaştıkça küçülsün.
        // Modelin dünya Z'si (fixedWorldPosition.z) ile kameranın dünya Z'si arasındaki mesafeyi kullanacağız.

        const distanceToModel = animatedModel.object3D.position.distanceTo(worldCameraPosition);
        
        // Bu formül, uzaklık arttıkça ölçeğin azalmasını, azaldıkça artmasını sağlar.
        // 'referenceDistance' ve 'scaleFactorMultiplier' ile oynayarak istediğin etkiyi yakalayabilirsin.
        const referenceDistance = Math.abs(fixedWorldPosition.z) + 10; // Modelin z pozisyonuna göre bir referans uzaklık
        const scaleFactorMultiplier = 500; // Bu değeri ayarlayarak hassasiyeti kontrol et (daha büyük = daha dramatik değişim)
        
        // Ters orantılı ölçeklendirme: uzaklık arttıkça faktör küçülür
        let newScaleFactor = scaleFactorMultiplier / (distanceToModel + 1); // +1 bölme hatasını önler

        // Ölçek faktörünü sınırlayabiliriz, aşırı büyük veya küçük olmasın
        newScaleFactor = Math.max(0.1, Math.min(2.0, newScaleFactor)); // Örn: 0.1x ile 2.0x arasında

        const finalScale = initialModelScaleValue * newScaleFactor;
        animatedModel.object3D.scale.set(finalScale, finalScale, finalScale);
        
        // console.log(`Kamera Dünya Z: ${worldCameraPosition.z.toFixed(2)}, Model Dünya Z: ${animatedModel.object3D.position.z.toFixed(2)}, Mesafe: ${distanceToModel.toFixed(2)}, Yeni Ölçek Faktör: ${newScaleFactor.toFixed(2)}, Final Ölçek: ${finalScale.toFixed(2)}`);
      }
    };
  }
});

      // Fotoğraf çekme fonksiyonu - AYNI KALDI
      async function takeScreenshot() {
        console.log("AR fotoğrafı çekiliyor...");

        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl) {
          console.error("A-Frame sahnesi bulunamadı.");
          alert("Fotoğraf çekilemedi: A-Frame sahnesi bulunamadı.");
          return;
        }

        const videoElement = document.querySelector('video');
        if (!videoElement || videoElement.readyState < 2) {
          console.error("Kamera video elementi bulunamadı veya hazır değil.");
          alert("Fotoğraf çekilemedi: Kamera videosu hazır değil veya bulunamadı. Lütfen kamera izni verdiğinizden ve video akışının başladığından emin olun.");
          return;
        }

        const arWebGLCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;
        if (!arWebGLCanvas) {
          console.error("A-Frame render canvas'ı bulunamadı.");
          alert("Fotoğraf çekilemedi: AR içeriği canvas'ı bulunamadı.");
          return;
        }

        try {
          videoElement.pause();

          const combinedCanvas = document.createElement("canvas");
          let captureWidth = videoElement.videoWidth;
          let captureHeight = videoElement.videoHeight;

          if (captureWidth === 0 || captureHeight === 0) {
              console.warn("Video gerçek piksel boyutları alınamadı. Ekran viewport boyutları kullanılıyor.");
              captureWidth = window.innerWidth;
              captureHeight = window.innerHeight;
          }

          const resolutionMultiplier = 2;	

          combinedCanvas.width = captureWidth * resolutionMultiplier;
          combinedCanvas.height = captureHeight * resolutionMultiplier;

          const ctx = combinedCanvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          let arCanvasForScreenshot = sceneEl.components.screenshot.getCanvas('perspective');

          if (!arCanvasForScreenshot) {
              console.error("A-Frame screenshot canvas'ı 'perspective' bulunamadı.");
              alert("Fotoğraf çekilemedi: 3D model katmanı bulunamadı.");
              return;
          }

          ctx.drawImage(arCanvasForScreenshot, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          const screenshotDataURL = combinedCanvas.toDataURL('image/png');

          if (screenshotDataURL === 'data:,') {
            console.warn("Çekilen fotoğraf boş veya geçersiz. Tekrar denenecek.");
            alert("Fotoğraf çekilemedi: Görüntü yakalanamadı. Lütfen kamera akışının aktif olduğundan ve modelin göründüğünden emin olun.");
            return;
          }

          const link = document.createElement('a');
          link.href = screenshotDataURL;
          link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          console.log("AR fotoğrafı başarıyla alındı ve indirildi.");

        } catch (error) {
          console.error("Fotoğraf çekme sırasında kritik hata oluştu:", error);
          alert("Fotoğraf çekilemedi. Tarayıcıda bir hata oluştu veya izinler yetersiz. Lütfen konsolu kontrol edin. (Hata detayı: " + error.message + ")");
        } finally {
            if (videoElement.paused) {
                videoElement.play();
            }
        }
      }

      // AR sahnesini sıfırlama ve hedef arama moduna dönme
      function resetARScene() {
          console.log("AR sahnesi sıfırlanıyor ve hedef arama moduna dönülüyor...");
          location.reload(); // Sayfayı yeniden yüklemek en temiz sıfırlama yoludur
          
          if (backgroundMusic && backgroundMusic.playing()) {
              backgroundMusic.stop();
              console.log("Howler.js sesi durduruldu.");
          }
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      webgl-renderer="preserveDrawingBuffer: true;"  
      screenshot="" > 
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1"
          visible="false"> </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek  İnşaallah</button>
    <button class="capture-button" style="bottom: 80px; background-color: #f44336;" onclick="resetARScene()">Yeniden Hedef Ara</button>

  </body>
</html>
