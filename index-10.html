<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>

    <script>
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;
          const sceneEl = document.querySelector('a-scene');
          const animatedModel = document.querySelector('#animatedModel');

          this.targetFoundOnce = false;
          this.isModelAttachedToTarget = true;

          // Yeni: Kamera kontrolü için değişkenler
          this.camera = document.querySelector('a-camera');
          this.lastDistance = null;
          this.scaleInterval = null;

          let mindarUiOverlay = null;

          sceneEl.addEventListener('loaded', () => {
              mindarUiOverlay = document.querySelector('.mindar-ui-overlay.mindar-ui-scanning');
          });

          el.addEventListener("targetFound", () => {
            console.log("AR Hedefi algılandı!");

            if (!this.targetFoundOnce) {
              if (backgroundMusic && !backgroundMusic.playing()) {
                backgroundMusic.play();
              }
              this.targetFoundOnce = true;
            }

            if (!this.isModelAttachedToTarget) {
              sceneEl.object3D.remove(animatedModel.object3D);
              el.object3D.add(animatedModel.object3D);
              animatedModel.setAttribute('position', '0 -0.5 0.1');
              animatedModel.setAttribute('rotation', '0 0 0');
              animatedModel.setAttribute('scale', '0.5 0.5 0.5');
              this.isModelAttachedToTarget = true;
            }

            animatedModel.setAttribute('visible', true);

            // Yeni: Ölçek kontrolü durdurulsun
            if (this.scaleInterval) {
              clearInterval(this.scaleInterval);
              this.scaleInterval = null;
              this.lastDistance = null;
            }
          });

          el.addEventListener("targetLost", () => {
            console.log("AR Hedefi kaybedildi!");

            if (this.targetFoundOnce && this.isModelAttachedToTarget) {
              el.object3D.remove(animatedModel.object3D);
              sceneEl.object3D.add(animatedModel.object3D);

              const lastWorldPos = new THREE.Vector3();
              animatedModel.object3D.getWorldPosition(lastWorldPos);
              const lastWorldRot = new THREE.Quaternion();
              animatedModel.object3D.getWorldQuaternion(lastWorldRot);
              const lastWorldScale = new THREE.Vector3();
              animatedModel.object3D.getWorldScale(lastWorldScale);

              animatedModel.object3D.position.copy(lastWorldPos);
              animatedModel.object3D.quaternion.copy(lastWorldRot);
              animatedModel.object3D.scale.copy(lastWorldScale);

              this.isModelAttachedToTarget = false;
            }

            if (mindarUiOverlay) {
              mindarUiOverlay.style.setProperty('display', 'none', 'important');
            }

            // Yeni: Kamera–model mesafesine göre ölçek kontrolü başlat
            this.scaleInterval = setInterval(() => {
              if (!this.isModelAttachedToTarget && this.camera) {
                const modelWorldPos = new THREE.Vector3();
                animatedModel.object3D.getWorldPosition(modelWorldPos);

                const cameraWorldPos = new THREE.Vector3();
                this.camera.object3D.getWorldPosition(cameraWorldPos);

                const currentDistance = modelWorldPos.distanceTo(cameraWorldPos);

                if (this.lastDistance !== null && this.lastDistance > 0) {
                  const scaleRatio = currentDistance / this.lastDistance;
                  const clampedRatio = Math.min(Math.max(scaleRatio, 0.8), 1.2); // %20'den fazla sapma olmasın
                  const currentScale = animatedModel.object3D.scale.clone();
                  const newScale = currentScale.multiplyScalar(clampedRatio);
                  animatedModel.object3D.scale.copy(newScale);
                }

                this.lastDistance = currentDistance;
              }
            }, 100);
          });
        },
      });

      async function takeScreenshot() {
        const sceneEl = document.querySelector('a-scene');
        const videoElement = document.querySelector('video');
        const arWebGLCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;

        if (!sceneEl || !videoElement || !arWebGLCanvas) {
          alert("Fotoğraf çekilemedi.");
          return;
        }

        try {
          videoElement.pause();

          const combinedCanvas = document.createElement("canvas");
          let captureWidth = videoElement.videoWidth || window.innerWidth;
          let captureHeight = videoElement.videoHeight || window.innerHeight;

          const resolutionMultiplier = 2;
          combinedCanvas.width = captureWidth * resolutionMultiplier;
          combinedCanvas.height = captureHeight * resolutionMultiplier;

          const ctx = combinedCanvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);

          const arCanvasForScreenshot = sceneEl.components.screenshot.getCanvas('perspective');
          if (!arCanvasForScreenshot) {
            alert("3D model katmanı bulunamadı.");
            return;
          }

          ctx.drawImage(arCanvasForScreenshot, 0, 0, combinedCanvas.width, combinedCanvas.height);

          const screenshotDataURL = combinedCanvas.toDataURL('image/png');
          if (screenshotDataURL === 'data:,') {
            alert("Görüntü yakalanamadı.");
            return;
          }

          const link = document.createElement('a');
          link.href = screenshotDataURL;
          link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (error) {
          alert("Fotoğraf çekilemedi. Hata: " + error.message);
        } finally {
          if (videoElement.paused) videoElement.play();
        }
      }

      function resetARScene() {
        location.reload();
        if (backgroundMusic && backgroundMusic.playing()) {
          backgroundMusic.stop();
        }
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      webgl-renderer="preserveDrawingBuffer: true;"
      screenshot="">
      
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1"
          visible="false">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek İnşaallah</button>
    <button class="capture-button" style="bottom: 80px; background-color: #f44336;" onclick="resetARScene()">Yeniden Hedef Ara</button>
  </body>
</html>
