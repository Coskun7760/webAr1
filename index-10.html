<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      .capture-button:nth-of-type(2) { 
        bottom: 80px;
        background-color: #f44336;
      }
      .capture-button:nth-of-type(2):hover {
        background-color: #d32f2f;
      }

      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>

    <script>
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el; // Bu, belirli bir mindar-image-target etiketi olacak
          const sceneEl = document.querySelector('a-scene');
          
          // Her hedefin kendi içindeki modeli bulunur
          const animatedModel = el.querySelector('a-gltf-model');
          const targetIndex = el.getAttribute('mindar-image-target').targetIndex;

          let mindarUiOverlay = null;

          sceneEl.addEventListener('loaded', () => {
              mindarUiOverlay = document.querySelector('.mindar-ui-overlay.mindar-ui-scanning');
              if (mindarUiOverlay) {
                  mindarUiOverlay.style.setProperty('display', 'none', 'important');
              }
          });		
          
          // Hedef bulunduğunda
          el.addEventListener("targetFound", (event) => {
            console.log(`AR Hedefi ${targetIndex} algılandı!`);

            // Diğer tüm modelleri gizle
            document.querySelectorAll('a-gltf-model').forEach(model => {
                model.setAttribute('visible', false);
            });

            // Sadece bu hedefin modelini göster
            if (animatedModel) {
                animatedModel.setAttribute('visible', true);
            }
            
            // Eğer ilk kez bir hedef bulunuyorsa müziği başlat
            if (!backgroundMusic.playing()) {
                backgroundMusic.play();
            }
          });

          // Hedef kaybedildiğinde
          el.addEventListener("targetLost", (event) => {
            console.log(`AR Hedefi ${targetIndex} kaybedildi!`);

            // Bu hedefin modelini gizle
            if (animatedModel) {
                animatedModel.setAttribute('visible', false);
            }

            // Diğer hedeflerden herhangi biri hala algılanıyorsa müziği durdurma
            const anyTargetFound = Array.from(document.querySelectorAll('[mindar-image-target]')).some(targetEl => {
                // MindAR'ın dahili durumunu kontrol etmek yerine, 'targetFound' event'inin aktif olarak
                // olup olmadığını kontrol etmek daha güvenlidir. Ancak bu bilgi doğrudan bir property olarak
                // açıkta olmayabilir. En basit yol, tüm modellerin görünürlüğünü kontrol etmektir.
                return targetEl.querySelector('a-gltf-model') && targetEl.querySelector('a-gltf-model').getAttribute('visible');
            });


            if (!anyTargetFound && backgroundMusic.playing()) {
                 // Hiçbir hedef algılanmıyorsa müziği durdur
                backgroundMusic.stop();
            }

            if (mindarUiOverlay) {
                mindarUiOverlay.style.setProperty('display', 'none', 'important');
            }
          });
        },
      });

      // Fotoğraf çekme fonksiyonu - Değişmedi
      async function takeScreenshot() {
        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl) return alert("Fotoğraf çekilemedi: A-Frame sahnesi bulunamadı.");

        const videoElement = document.querySelector('video');
        if (!videoElement || videoElement.readyState < 2) return alert("Fotoğraf çekilemedi: Kamera videosu hazır değil veya bulunamadı.");

        const arWebGLCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;
        if (!arWebGLCanvas) return alert("Fotoğraf çekilemedi: AR içeriği canvas'ı bulunamadı.");

        try {
          videoElement.pause(); 

          const combinedCanvas = document.createElement("canvas");
          let captureWidth = videoElement.videoWidth;
          let captureHeight = videoElement.videoHeight;

          if (captureWidth === 0 || captureHeight === 0) {
              captureWidth = window.innerWidth;
              captureHeight = window.innerHeight;
          }

          const resolutionMultiplier = 2; 
          combinedCanvas.width = captureWidth * resolutionMultiplier;
          combinedCanvas.height = captureHeight * resolutionMultiplier;

          const ctx = combinedCanvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          let arCanvasForScreenshot = sceneEl.components.screenshot.getCanvas('perspective');

          if (!arCanvasForScreenshot) return alert("Fotoğraf çekilemedi: 3D model katmanı bulunamadı.");

          ctx.drawImage(arCanvasForScreenshot, 0, 0, combinedCanvas.width, combinedCanvas.height);
          
          const screenshotDataURL = combinedCanvas.toDataURL('image/png');

          if (screenshotDataURL === 'data:,') return alert("Fotoğraf çekilemedi: Görüntü yakalanamadı.");

          const link = document.createElement('a');
          link.href = screenshotDataURL;
          link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

        } catch (error) {
          alert("Fotoğraf çekilemedi. Hata: " + error.message);
        } finally {
            if (videoElement.paused) {
                videoElement.play();
            }
        }
      }

      function resetARScene() {
          location.reload();
          if (backgroundMusic && backgroundMusic.playing()) {
              backgroundMusic.stop();
          }
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targetsMulti.mind; filterMinCF:0.0001; filterBeta: 0.001;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      webgl-renderer="preserveDrawingBuffer: true;"  
      screenshot="" > 
      <a-assets>
        <a-asset-item id="model1" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <a-asset-item id="model2" src="https://coskun7760.github.io/webAr1/muze-123.gltf"></a-asset-item> 
		<a-asset-item id="model3" src="https://coskun7760.github.io/webAr1/muze-1234.gltf"></a-asset-item> 
		  
		<audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera 
        position="0 0 0" 
        look-controls="enabled: true; touchEnabled: true; zoom: false" 
        wasd-controls="enabled: false"
        far="10000"
        fov="80">
      </a-camera>

      <a-entity mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel1"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#model1"
          animation-mixer="timeScale: 1"
          visible="false">
        </a-gltf-model>
      </a-entity>

      <a-entity mytarget mindar-image-target="targetIndex: 1">
        <a-gltf-model
          id="animatedModel2"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#model2"
          animation-mixer="timeScale: 1"
          visible="false">
        </a-gltf-model>
      </a-entity>

      <a-entity mytarget mindar-image-target="targetIndex: 2">
        <a-gltf-model
          id="animatedModel3"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#model3"
          animation-mixer="timeScale: 1"
          visible="false">
        </a-gltf-model>
      </a-entity>

    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek İnşaallah</button>
    <button class="capture-button" onclick="resetARScene()">Yeniden Hedef Ara</button>

  </body>
</html>
