updateButtonState(false);


async function startRecording() {
    console.log("Kayıt başlatılıyor...");
    const sceneEl = document.querySelector('a-scene');
    const videoElement = document.querySelector('video');
    const arWebGLCanvas = sceneEl.renderer.domElement;

    if (!sceneEl || !videoElement || !arWebGLCanvas || videoElement.readyState < 2) {
        alert("Video kaydedilemedi: Gerekli elementler bulunamadı veya kamera hazır değil.");
        return;
    }

    try {
        // Canvas boyutlarını kameranın doğal boyutlarına ayarla
        combinedCanvas.width = videoElement.videoWidth;
        combinedCanvas.height = videoElement.videoHeight;

        // Her karede canvas'ı güncelleme döngüsünü başlat
        function drawFrame() {
            // Önce kamera videosunu çiz
            ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);
            // Sonra AR içeriğini çiz
            ctx.drawImage(arWebGLCanvas, 0, 0, combinedCanvas.width, combinedCanvas.height);
            animationFrameId = requestAnimationFrame(drawFrame);
        }
        animationFrameId = requestAnimationFrame(drawFrame);

        // Birleşik canvas'tan video ve ses akışını al
        const canvasStream = combinedCanvas.captureStream(60); 
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const combinedStream = new MediaStream();
        canvasStream.getTracks().forEach(track => combinedStream.addTrack(track));
        audioStream.getTracks().forEach(track => combinedStream.addTrack(track));

        stream = combinedStream;
        recordedBlobs = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

        mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
                recordedBlobs.push(event.data);
            }
        };

        mediaRecorder.onstop = () => {
            cancelAnimationFrame(animationFrameId); // Döngüyü durdur
            const superBuffer = new Blob(recordedBlobs, { type: 'video/webm' });
            const videoURL = window.URL.createObjectURL(superBuffer);

            const link = document.createElement('a');
            link.href = videoURL;
            link.download = `MindAR_AR_Video_${new Date().getTime()}.webm`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(videoURL);
            
            updateButtonState(false);
        };

        mediaRecorder.start();
        console.log('Kayıt başladı.');
        updateButtonState(true);

    } catch (e) {
        console.error('Kayıt başlatılamadı:', e);
        alert('Video ve ses kaydı için izinler gerekli. Hata detayı: ' + e.message);
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        updateButtonState(false);
    }
}

function stopRecording() {
    console.log("Kayıt durduruluyor...");
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
    }
}

function handleRecordButtonClick() {
    if (isRecording) {
        stopRecording();
    } else {
        startRecording();
    }
}
