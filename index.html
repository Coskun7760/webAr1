<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <script>
      // Howler.js ses nesnesini global olarak bir kez tanımla
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'], // Senin ses dosyan
        loop: true, // Müziğin döngüde çalmasını sağlar
        volume: 0.7, // Ses seviyesini ayarla (0.0 ile 1.0 arasında)
        autoplay: false // Otomatik başlamasın, biz kontrol edelim
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el; // Hedef entity'yi (mytarget) temsil eder

          el.addEventListener("targetFound", (event) => {
            console.log("AR Hedefi algılandı! Model görünür olmalı.");

            // Howler.js sesini başlat
            if (backgroundMusic && !backgroundMusic.playing()) {
                backgroundMusic.play();
                console.log("Howler.js sesi oynatılıyor.");
            } else if (backgroundMusic && backgroundMusic.playing()) {
                console.log("Howler.js sesi zaten çalıyor.");
            } else {
                console.warn("Howler.js sesi başlatılamadı.");
            }
          });

          el.addEventListener("targetLost", (event) => {
            console.log("AR Hedefi kaybedildi! Model gizleniyor.");

            // Howler.js sesini durdur
            if (backgroundMusic && backgroundMusic.playing()) {
                backgroundMusic.pause();
                console.log("Howler.js sesi durduruldu.");
            }
          });
        },
      });
		
		
		AFRAME.registerComponent('custom-animation-manager', {
  init: function () {
    this.mixer = null;
    this.actions = {};
    this.clipsLoaded = false;

    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      if (!model) { return; }

      this.mixer = new THREE.AnimationMixer(model);
      const clips = model.animations;

      if (clips && clips.length > 0) {
        clips.forEach(clip => {
          // Animasyon isimlerini kontrol et ve istediğin klipleri al
          if (clip.name === 'hareket' || clip.name === 'hareket2') {
            const action = this.mixer.clipAction(clip);
            action.loop = THREE.LoopRepeat; // Döngü ayarı
            action.timeScale = 1; // Hız ayarı
            this.actions[clip.name] = action;
          }
        });
        this.clipsLoaded = true;
      }

      // THREE.js update döngüsüne mixer'ı ekle
      this.el.sceneEl.addEventListener('tick', (evt) => {
        if (this.mixer) {
          this.mixer.update(evt.detail.deltaTime);
        }
      });
    });

    this.el.sceneEl.addEventListener('targetFound', () => {
      if (this.clipsLoaded) {
        // İki animasyonu aynı anda başlat
        if (this.actions['hareket']) {
          this.actions['hareket'].play();
        }
        if (this.actions['hareket2']) {
          this.actions['hareket2'].play();
        }
        console.log("Custom animasyonlar başlatıldı.");
      }
    });

    this.el.sceneEl.addEventListener('targetLost', () => {
      if (this.clipsLoaded) {
        // İki animasyonu duraklat
        if (this.actions['hareket']) {
          this.actions['hareket'].stop(); // Stop yerine pause de kullanılabilir
        }
        if (this.actions['hareket2']) {
          this.actions['hareket2'].stop(); // Stop yerine pause de kullanılabilir
        }
        console.log("Custom animasyonlar durduruldu.");
      }
    });
  },
});
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001" vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
			  id="animatedModel"
			  position="0 -0.5 0.1"
			  scale="0.5 0.5 0.5"
			  src="#avatarModel"
			  custom-animation-manager ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
