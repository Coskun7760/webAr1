<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #screenshotBtn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 9999;
        padding: 10px 15px;
        font-size: 16px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>

    <script>
      // Howler.js ses nesnesi
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;

          el.addEventListener("targetFound", () => {
            console.log("AR Hedefi algılandı!");
            if (!backgroundMusic.playing()) {
              backgroundMusic.play();
            }
          });

          el.addEventListener("targetLost", () => {
            console.log("AR Hedefi kaybedildi!");
            if (backgroundMusic.playing()) {
              backgroundMusic.pause();
            }
          });
        },
      });

      // Ekran görüntüsünü al (kamera + model + her şey)
      async function tamEkranGoruntusu() {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" }
          });

          const video = document.createElement("video");
          video.srcObject = stream;
          video.play();

          video.onloadeddata = () => {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext("2d");

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              const link = document.createElement("a");
              link.href = URL.createObjectURL(blob);
              link.download = "tum-sahne-goruntusu.png";
              link.click();

              stream.getTracks().forEach(track => track.stop()); // yayını kapat
            });
          };
        } catch (err) {
          alert("Ekran görüntüsü alınamadı: " + err.message);
        }
      }
    </script>
  </head>

  <body>
    <button id="screenshotBtn" onclick="tamEkranGoruntusu()">📸 Ekran Görüntüsü Al</button>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf" crossorigin="anonymous"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
