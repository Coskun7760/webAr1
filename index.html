<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      /* Butonu AR sahnesinin üzerinde konumlandırmak için stil */
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50; /* Yeşil */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000; /* AR sahnesinin üzerinde görünmesi için */
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
      /* MindAR tarafından oluşturulan video elemanını bulmak için yardımcı stil (gerekli değil ama görselleştirebilir) */
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>

    <script>
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;

          el.addEventListener("targetFound", (event) => {
            console.log("AR Hedefi algılandı! Model görünür olmalı.");
            if (backgroundMusic && !backgroundMusic.playing()) {
                backgroundMusic.play();
                console.log("Howler.js sesi oynatılıyor.");
            } else if (backgroundMusic && backgroundMusic.playing()) {
                console.log("Howler.js sesi zaten çalıyor.");
            } else {
                console.warn("Howler.js sesi başlatılamadı.");
            }
          });

          el.addEventListener("targetLost", (event) => {
            console.log("AR Hedefi kaybedildi! Model gizleniyor.");
            if (backgroundMusic && backgroundMusic.playing()) {
                backgroundMusic.pause();
                console.log("Howler.js sesi durduruldu.");
            }
          });
        },
      });

      // Fotoğraf çekme fonksiyonu - Video akışını ve 3D içeriği birleştiriyoruz
      async function takeScreenshot() {
        console.log("AR fotoğrafı çekiliyor...");

        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl) {
          console.error("A-Frame sahnesi bulunamadı.");
          alert("Fotoğraf çekilemedi: A-Frame sahnesi bulunamadı.");
          return;
        }

        // 1. MindAR'ın kamera video elementini bul
        const videoElement = document.querySelector('video'); 
        if (!videoElement || videoElement.readyState < 2) { // Video hazır mı kontrolü
          console.error("Kamera video elementi bulunamadı veya hazır değil.");
          alert("Fotoğraf çekilemedi: Kamera videosu hazır değil veya bulunamadı. Lütfen kamera izni verdiğinizden ve video akışının başladığından emin olun.");
          return;
        }

        // 2. A-Frame'in 3D içeriği çizdiği canvas'ı al
        const arCanvas = sceneEl.renderer ? sceneEl.renderer.domElement : null;
        if (!arCanvas) {
          console.error("A-Frame render canvas'ı bulunamadı.");
          alert("Fotoğraf çekilemedi: AR içeriği canvas'ı bulunamadı.");
          return;
        }

        // 3. Geçici bir canvas oluştur
        const combinedCanvas = document.createElement('canvas');
        // Canvas boyutlarını, videonun gerçek boyutlarına veya pencere boyutuna ayarla
        combinedCanvas.width = videoElement.videoWidth || window.innerWidth;
        combinedCanvas.height = videoElement.videoHeight || window.innerHeight;
        
        // Eğer video boyutu sıfır geliyorsa, ekran boyutunu kullan (fallback)
        if (combinedCanvas.width === 0 || combinedCanvas.height === 0) {
            combinedCanvas.width = window.innerWidth;
            combinedCanvas.height = window.innerHeight;
            console.warn("Video boyutu sıfır. Ekran boyutları kullanılıyor.");
        }

        const ctx = combinedCanvas.getContext('2d');

        try {
          // 4. Video akışını geçici canvas'a çiz
          // `crossOrigin` hatasını önlemek için `videoElement`'in kendisini çekiyoruz.
          ctx.drawImage(videoElement, 0, 0, combinedCanvas.width, combinedCanvas.height);

          // 5. 3D modeli içeren AR canvas'ını video üzerine çiz
          // Bu adımda 3D modelin doğru şekilde çizilmesi için 'preserveDrawingBuffer' gerekli.
          ctx.drawImage(arCanvas, 0, 0, combinedCanvas.width, combinedCanvas.height);

          // 6. Birleşik canvas'tan görüntüyü al
          const screenshotDataURL = combinedCanvas.toDataURL('image/png');

          // Görüntüyü indirmek için bir link oluştur
          const link = document.createElement('a');
          link.href = screenshotDataURL;
          link.download = 'MindAR_AR_Fotografi_' + new Date().getTime() + '.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          console.log("AR fotoğrafı başarıyla alındı ve indirildi.");

        } catch (error) {
          console.error("Birleşik canvas'tan fotoğraf çekilirken hata oluştu:", error);
          alert("Fotoğraf çekilemedi. Tarayıcı izinlerini veya içeriğin yüklenmesini bekleyin. (Hata detayı: " + error.message + ")");
        }
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      webgl-renderer="preserveDrawingBuffer: true;" >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çek İnşaallah</button>

  </body>
</html>
