<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #f9f9f9;
        margin: 0;
        overflow: hidden;
      }

      #ekranAlBtn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        padding: 10px 15px;
        font-size: 16px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
      }
    </style>

    <script>
      // Howler.js ses nesnesi
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;

          el.addEventListener("targetFound", () => {
            console.log("AR Hedefi algılandı!");
            if (!backgroundMusic.playing()) {
              backgroundMusic.play();
            }
          });

          el.addEventListener("targetLost", () => {
            console.log("AR Hedefi kaybedildi!");
            if (backgroundMusic.playing()) {
              backgroundMusic.pause();
            }
          });
        },
      });

      function sahneGoruntusuAl() {
        const scene = document.querySelector("a-scene");

        // render edilmiş canvas'ı al
        const canvas = scene.renderer.domElement;

        // Görüntüyü indir
        const imageData = canvas.toDataURL("image/png");

        const link = document.createElement("a");
        link.href = imageData;
        link.download = "aframe-ekran-goruntusu.png";
        link.click();
      }
    </script>
  </head>

  <body>
    <button id="ekranAlBtn" onclick="sahneGoruntusuAl()">Sahne Görüntüsü Al</button>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
