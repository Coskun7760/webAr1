<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      // Howler.js ses nesnesini global olarak bir kez tanımla
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'], // Senin ses dosyan
        // loop: true, // Müziğin döngüde çalmasını sağlar
        volume: 1.0, // Ses seviyesini ayarla (0.0 ile 1.0 arasında)
        autoplay: false // Otomatik başlamasın, biz kontrol edelim
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el; // Hedef entity'yi (mytarget) temsil eder

          el.addEventListener("targetFound", (event) => {
            console.log("AR Hedefi algılandı! Model görünür olmalı.");

            // Howler.js sesini başlat
            if (backgroundMusic && !backgroundMusic.playing()) {
                backgroundMusic.play();
                console.log("Howler.js sesi oynatılıyor.");
            } else if (backgroundMusic && backgroundMusic.playing()) {
                console.log("Howler.js sesi zaten çalıyor.");
            } else {
                console.warn("Howler.js sesi başlatılamadı.");
            }
          });

          el.addEventListener("targetLost", (event) => {
            console.log("AR Hedefi kaybedildi! Model gizleniyor.");

            // Howler.js sesini durdur
            if (backgroundMusic && backgroundMusic.playing()) {
                backgroundMusic.pause();
                console.log("Howler.js sesi durduruldu.");
            }
          });
        },
      });
    </script>
	  
	  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    .bolum {
      height: 800px;
      margin-bottom: 20px;
      background-color: #e0e0e0;
      padding: 10px;
    }
  </style>
  </head>
  <body>
   
		 <button onclick="tumSayfayiCek()">Tüm Sayfanın Ekran Görüntüsü</button>
  
	  
	 

  <script>
    function tumSayfayiCek() {
      html2canvas(document.body, {
        useCORS: true,
        scrollY: -window.scrollY, // Sayfa kaydırmasını sıfırlamak için
        windowWidth: document.body.scrollWidth,
        windowHeight: document.body.scrollHeight
      }).then(canvas => {
        // Görüntüyü indir
        canvas.toBlob(function(blob) {
          const link = document.createElement('a');
          link.download = "tum-sayfa-goruntusu.png";
          link.href = URL.createObjectURL(blob);
          link.click();
        });
      });
    }
  </script>
  </body>
</html>
