<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR + Kamera + 3D Screenshot</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000;
      }
    </style>

    <script>
      const backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;
          el.addEventListener("targetFound", () => {
            if (!backgroundMusic.playing()) backgroundMusic.play();
          });
          el.addEventListener("targetLost", () => {
            if (backgroundMusic.playing()) backgroundMusic.pause();
          });
        },
      });

      function takeScreenshot() {
        const canvas = document.querySelector('a-scene').renderer.domElement;
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = 'ar-fotograf_' + Date.now() + '.png';
        link.click();
      }
    </script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      webgl-renderer="preserveDrawingBuffer: true"
      screenshot
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
      </a-assets>

      <!-- Kamera görüntüsünü 3D sahneye yerleştir (arka plan olarak) -->
      <a-entity id="camera-plane" position="0 0 -1" geometry="primitive: plane; height: 2; width: 2.5" material="shader: flat; src: #cameraTexture"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <!-- Gizli video elementi: MindAR tarafından kullanılır -->
    <video id="cameraFeed" autoplay playsinline webkit-playsinline style="display: none;"></video>

    <!-- Buton -->
    <button class="capture-button" onclick="takeScreenshot()">Fotoğrafff Çek</button>

    <script>
      // MindAR kamera akışını yakalayıp sahneye texture olarak bindir
      const video = document.querySelector("#cameraFeed");

      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then((stream) => {
          video.srcObject = stream;

          // Video texture'ı hazır olunca A-Frame düzlemine ata
          video.onloadeddata = () => {
            const scene = document.querySelector('a-scene');
            const texture = new THREE.VideoTexture(video);
            const cameraPlane = scene.querySelector('#camera-plane');
            cameraPlane.getObject3D('mesh').material.map = texture;
            cameraPlane.getObject3D('mesh').material.needsUpdate = true;
          };
        })
        .catch((err) => {
          alert("Kamera erişimi reddedildi veya hata oluştu.");
          console.error(err);

        });
    </script>
  </body>
</html>
