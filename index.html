<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        z-index: 9999;
        cursor: pointer;
      }
    </style>

    <script>
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;
          el.addEventListener("targetFound", () => {
            if (!backgroundMusic.playing()) backgroundMusic.play();
          });
          el.addEventListener("targetLost", () => {
            if (backgroundMusic.playing()) backgroundMusic.pause();
          });
        }
      });

      async function captureARScene() {
        const video = document.querySelector("video");
        const scene = document.querySelector("a-scene");
        const rendererCanvas = scene.renderer && scene.renderer.domElement;

        if (!video || !rendererCanvas) {
          alert("Kamera veya 3D sahne bulunamadı.");
          return;
        }

        const canvas = document.createElement("canvas");
        const width = video.videoWidth || window.innerWidth;
        const height = video.videoHeight || window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        // Kamera görüntüsünü çiz
        ctx.drawImage(video, 0, 0, width, height);

        // 3D modeli çiz
        ctx.drawImage(rendererCanvas, 0, 0, width, height);

        // Fotoğrafı indir
        const dataURL = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.href = dataURL;
        link.download = "ar-fotograf.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      webgl-renderer="preserveDrawingBuffer: true"
      screenshot
      embedded
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="captureARScene()">📸 Fotoğraf Çek</button>
  </body>
</html>
