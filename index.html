<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindAR Kamera + 3D Fotoğraf</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000;
      }

      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>

    <script>
      // Arka plan müziği
      const backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'],
        volume: 1.0,
        autoplay: false
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el;
          el.addEventListener("targetFound", () => {
            if (!backgroundMusic.playing()) backgroundMusic.play();
          });
          el.addEventListener("targetLost", () => {
            if (backgroundMusic.playing()) backgroundMusic.pause();
          });
        },
      });

      async function takeScreenshot() {
        const sceneEl = document.querySelector('a-scene');
        const rendererCanvas = sceneEl.renderer.domElement;
        const video = document.querySelector('video');

        if (!rendererCanvas || !video || video.readyState < 2) {
          alert("Görüntü alınamadı. Video veya WebGL canvas hazır değil.");
          return;
        }

        const width = rendererCanvas.width;
        const height = rendererCanvas.height;

        // Geçici canvas oluştur
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = width;
        finalCanvas.height = height;
        const ctx = finalCanvas.getContext('2d');

        // Kamera görüntüsünü çiz
        ctx.drawImage(video, 0, 0, width, height);

        // 3D model canvas'ını çiz
        ctx.drawImage(rendererCanvas, 0, 0, width, height);

        // Veriyi indir
        const dataURL = finalCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = 'ar_fotografi_' + Date.now() + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      webgl-renderer="preserveDrawingBuffer: true"
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraff Çek</button>
  </body>
</html>
