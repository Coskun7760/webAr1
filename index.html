<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js"></script>

    <style>
      /* Butonu AR sahnesinin üzerinde konumlandırmak için stil */
      .capture-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 1.2em;
        background-color: #4CAF50; /* Yeşil */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 1000; /* AR sahnesinin üzerinde görünmesi için */
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: background-color 0.3s ease;
      }
      .capture-button:hover {
        background-color: #45a049;
      }
    </style>

    <script>
      // Howler.js ses nesnesini global olarak bir kez tanımlaa
      var backgroundMusic = new Howl({
        src: ['https://coskun7760.github.io/webAr1/ses.mp3'], // Senin ses dosyan
        // loop: true, // Müziğin döngüde çalmasını sağlar (yorum satırıydı, olduğu gibi bıraktım)
        volume: 1.0, // Ses seviyesini ayarla (0.0 ile 1.0 arasında)
        autoplay: false // Otomatik başlamasın, biz kontrol edelim
      });

      AFRAME.registerComponent("mytarget", {
        init: function () {
          const el = this.el; // Hedef entity'yi (mytarget) temsil eder

          el.addEventListener("targetFound", (event) => {
            console.log("AR Hedefi algılandı! Model görünür olmalı.");

            // Howler.js sesini başlat
            if (backgroundMusic && !backgroundMusic.playing()) {
                backgroundMusic.play();
                console.log("Howler.js sesi oynatılıyor.");
            } else if (backgroundMusic && backgroundMusic.playing()) {
                console.log("Howler.js sesi zaten çalıyor.");
            } else {
                console.warn("Howler.js sesi başlatılamadı.");
            }
          });

          el.addEventListener("targetLost", (event) => {
            console.log("AR Hedefi kaybedildi! Model gizleniyor.");

            // Howler.js sesini durdur
            if (backgroundMusic && backgroundMusic.playing()) {
                backgroundMusic.pause();
                console.log("Howler.js sesi durduruldu.");
            }
          });
        },
      });

      // Fotoğraf çekme fonksiyonu buraya eklendi
      function takeScreenshot() {
        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl) {
          console.error("A-Frame sahnesi bulunamadı.");
          return;
        }

        const cameraEl = sceneEl.querySelector('a-camera');
        if (!cameraEl) {
          console.error("A-Frame kamerası bulunamadı.");
          return;
        }
        const camera = cameraEl.components.camera.camera; // THREE.js kamera objesine erişim

        const renderer = sceneEl.renderer;
        if (!renderer) {
          console.error("A-Frame renderer bulunamadı.");
          return;
        }
        
        // Render etmeden önce sahnenin güncel state'ini yakala
        renderer.render(sceneEl.object3D, camera); // Doğrudan THREE.js kamera objesini kullan

        // Canvas'ı al ve Data URL'e dönüştür
        const screenshotDataURL = renderer.domElement.toDataURL('image/png');

        // Görüntüyü indirmek için bir link oluştur
        const link = document.createElement('a');
        link.href = screenshotDataURL;
        link.download = 'MindAR_EkranGoruntusu_' + new Date().getTime() + '.png'; // Benzersiz dosya adı
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        console.log("Ekran görüntüsü alındı ve indirildi.");
      }
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001" vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="avatarModel" src="https://coskun7760.github.io/webAr1/muze-12.gltf"></a-asset-item>
        <audio id="modelSound" src="https://coskun7760.github.io/webAr1/ses.mp3" preload="auto" crossorigin="anonymous"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="mytarget" mytarget mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="animatedModel"
          position="0 -0.5 0.1"
          scale="0.5 0.5 0.5"
          src="#avatarModel"
          animation-mixer="timeScale: 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <button class="capture-button" onclick="takeScreenshot()">Fotoğraf Çekk</button>

  </body>
</html>
